name: "Release"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v1.0.7. The tag has to exist. Its release is created when there is none yet, and the ZIP file is attached to it."
        required: true
        type: "string"

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      id-token: write
    env:
      BM6_ROOT_DIR: "${{ github.workspace }}/custom_components/bm6"
      RELEASE_TAG: "${{ github.event.release.tag_name || inputs.tag }}"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4.2.1"
        with:
          ref: "${{ github.event.release.tag_name || inputs.tag }}"

      - name: "Adjust version number"
        shell: bash
        run: |          
          version="${RELEASE_TAG}"
          version="${version,,}"
          version="${version#v}"
          # update const.py
          sed -i \
            "/^VERSION.*=./c\VERSION = \"${version}\"" \
            "${{ env.BM6_ROOT_DIR }}/const.py"
          # update manifest.json
          jq ".version = \"${version}\"" "${{ env.BM6_ROOT_DIR }}/manifest.json" > "${{ env.BM6_ROOT_DIR }}/manifest.json.tmp"
          mv "${{ env.BM6_ROOT_DIR }}/manifest.json.tmp" "${{ env.BM6_ROOT_DIR }}/manifest.json"

      - name: "Zip the integration directory"
        run: |
          cd "${{ env.BM6_ROOT_DIR }}"
          zip bm6.zip -r ./

      - name: "Sign release package"
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: "${{ env.BM6_ROOT_DIR }}/bm6.zip"

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: "${{ env.RELEASE_TAG }}"
          files: ${{ env.BM6_ROOT_DIR }}/bm6.zip
          fail_on_unmatched_files: true
