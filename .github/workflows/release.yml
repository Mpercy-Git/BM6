name: "Release"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v1.0.8. The tag is created at HEAD if it does not already exist. Its release is created when there is none yet, and the ZIP file is attached to it."
        required: true
        type: "string"

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      id-token: write
    env:
      BM6_ROOT_DIR: "${{ github.workspace }}/custom_components/bm6"
      RELEASE_TAG: "${{ github.event.release.tag_name || inputs.tag }}"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4.2.1"
        with:
          fetch-depth: 0

      - name: "Create tag if it does not exist"
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! git rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: "Check out the tag that is being built"
        # A release event already checked the tag out. A dispatch checked out
        # the branch it was started from, which is only the same commit when
        # the tag was just created above, so check the tag out explicitly.
        if: github.event_name == 'workflow_dispatch'
        run: git checkout --detach "${RELEASE_TAG}"

      - name: "Adjust version number"
        shell: bash
        run: |          
          version="${RELEASE_TAG}"
          version="${version,,}"
          version="${version#v}"
          # update const.py
          sed -i \
            "/^VERSION.*=./c\VERSION = \"${version}\"" \
            "${{ env.BM6_ROOT_DIR }}/const.py"
          # update manifest.json
          jq ".version = \"${version}\"" "${{ env.BM6_ROOT_DIR }}/manifest.json" > "${{ env.BM6_ROOT_DIR }}/manifest.json.tmp"
          mv "${{ env.BM6_ROOT_DIR }}/manifest.json.tmp" "${{ env.BM6_ROOT_DIR }}/manifest.json"

      - name: "Zip the integration directory"
        run: |
          cd "${{ env.BM6_ROOT_DIR }}"
          zip bm6.zip -r ./

      - name: "Sign release package"
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: "${{ env.BM6_ROOT_DIR }}/bm6.zip"
          # The signing action only attaches the bundle for a release event,
          # so the upload step below does it for both ways of triggering.
          release-signing-artifacts: false

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: "${{ env.RELEASE_TAG }}"
          files: |
            ${{ env.BM6_ROOT_DIR }}/bm6.zip
            ${{ env.BM6_ROOT_DIR }}/bm6.zip.sigstore.json
          fail_on_unmatched_files: true
